apis:
- name: Adobe Campaign Classic JavaScript SDK
  description: >-
    An open-source JavaScript SDK that wraps Adobe Campaign Classic SOAP APIs in a simple, expressive,
    JavaScript-idiomatic interface. The SDK supports asynchronous promise-based operations for querying,
    data management, workflow control, and session management. It works server-side with Node.js and client-side
    in the browser, abstracting away SOAP calls, XML-to-JSON conversion, and type formatting. Compatible
    with Campaign Classic v7 and v8.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://opensource.adobe.com/acc-js-sdk/
  baseURL: https://{instance}.campaign.adobe.com
  tags:
  - Campaign Classic
  - JavaScript SDK
  - Node.js
  - Open Source
  - SOAP Wrapper
  properties:
  - type: Documentation
    url: https://opensource.adobe.com/acc-js-sdk/
  - type: GitHubRepository
    url: https://github.com/adobe/acc-js-sdk
  - type: NPMPackage
    url: https://www.npmjs.com/package/@adobe/acc-js-sdk
  aid: adobe-campaign:classic-javascript-sdk
- name: Adobe I/O Campaign Standard SDK
  description: >-
    A Node.js JavaScript SDK wrapping Adobe Campaign Standard REST APIs for use in Adobe I/O Runtime and
    App Builder applications. Provides convenience methods for profile management, service operations,
    workflow control, transactional messaging, GDPR compliance requests, and custom resource management.
    Handles authentication and API communication for building serverless integrations with Campaign Standard.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://github.com/adobe/aio-lib-campaign-standard
  baseURL: https://mc.adobe.io/{ORGANIZATION}/campaign
