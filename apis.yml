  - type: NPMPackage
    url: https://www.npmjs.com/package/@adobe/aio-lib-campaign-standard
  aid: adobe-campaign:io-campaign-standard-sdk
- name: Adobe Experience Platform Mobile SDK - Campaign Extensions
  description: >-
    Native mobile SDK extensions for iOS and Android that integrate Adobe Campaign push notifications,
    in-app messaging, and local notifications into mobile applications. Includes the Campaign Classic
    extension for v7 and v8 providing device registration and notification click tracking, and the Campaign
    Standard extension providing push identifier management and message interaction tracking. Part of
    the Adobe Experience Platform Mobile SDK framework.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
