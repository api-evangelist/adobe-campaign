specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Adobe Campaign
providerId: adobe-campaign
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Marketing
  - Campaign Management
  - Email Marketing
  - Cross-Channel Marketing
  - Customer Engagement
notes: >-
  Adobe Campaign is sold via enterprise contract. List pricing is not
  published. Two product editions exist: Adobe Campaign Standard (cloud,
  email-first) and Adobe Campaign v8 / Classic (on-premise/managed-cloud,
  cross-channel). Pricing is keyed to active profiles, channels, and message
  volume. API access is included with the underlying license.
description: >-
  Adobe Campaign is an enterprise cross-channel marketing platform sold via
  contact-sales contracts. Pricing depends on edition (Standard vs v8/Classic),
  active profile count, channels enabled (email, SMS, push, direct mail), and
  annual message volume. The Campaign API is included in all editions.
sources:
  - https://business.adobe.com/products/campaign/adobe-campaign.html
  - https://developer.adobe.com/campaign-standard-apis/
plans:
  - id: adobe-campaign-standard
    name: Adobe Campaign Standard
    type: enterprise
    description: >-
      Cloud-native edition for email-first cross-channel campaigns. Priced by
      active profiles and message volume.
    entries:
      - label: Active profiles + message commit
        name: campaign_standard_subscription
        type: subscription
        metric: profile
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Campaign Standard REST API
      - name: Email, SMS, push delivery
      - name: Adobe Experience Cloud integration
  - id: adobe-campaign-v8
    name: Adobe Campaign v8 / Classic
    type: enterprise
    description: >-
      Full cross-channel edition (email, SMS, push, direct mail, transactional)
      with managed-cloud or on-premise deployment.
    entries:
      - label: Profiles + channels + message commit
        name: campaign_v8_subscription
        type: subscription
        metric: profile
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Campaign Classic SOAP / REST APIs
      - name: Cross-channel orchestration
      - name: Direct mail integration
      - name: Customer Journey Analytics integration
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
