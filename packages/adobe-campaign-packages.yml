source: >-
  registry.npmjs.org, search.maven.org, trunk.cocoapods.org and
  api.github.com/search (org:adobe) queried directly 2026-08-13; cross-checked
  against the SDK links already in apis.yml.
notes: >-
  Adobe publishes first-party Adobe Campaign client libraries in three places:
  npm (the Campaign Classic JavaScript SDK and the Adobe I/O Campaign Standard
  SDK), Maven Central + CocoaPods (the Adobe Experience Platform Mobile SDK
  Campaign and Campaign Classic extensions for Android and iOS), and npm again
  for the React Native wrapper. There is no first-party Python, Ruby, Go, PHP,
  .NET or Java server-side Campaign SDK — server-side integrations call the REST
  or SOAP surface directly. Mobile-extension currency is the notable decay
  signal: the iOS/Android Campaign (Standard) extensions last shipped in 2024-2025
  while the Campaign Classic extensions were refreshed in 2026, which tracks the
  Campaign Standard end-of-life documented in lifecycle/.
