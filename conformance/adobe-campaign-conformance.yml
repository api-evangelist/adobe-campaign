    artifact: llms/adobe-campaign-llms.txt
  - id: gdpr
    name: GDPR / data subject rights
    conforms: true
    evidence: >-
      Campaign exposes a dedicated Privacy API (POST /privacy/privacyTool,
      openapi/adobe-campaign-privacy-api-openapi.yml) for access and delete
