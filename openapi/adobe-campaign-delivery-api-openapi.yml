openapi: 3.2.0
info:
  title: Adobe Campaign Classic Delivery API
  description: SOAP-based API for Adobe Campaign Classic v7 and v8, documented as HTTP POST operations. All operations target the single SOAP router endpoint at /nl/jsp/soaprouter.jsp and are differentiated by the SOAPAction header. Provides programmatic access to session management, data querying, record persistence, delivery management, workflow control, subscription management, and real-time transactional event ingestion.
  version: 8.0.0
  contact:
    name: Adobe Developer Support
    url: https://developer.adobe.com/
  license:
    name: Proprietary
    url: https://www.adobe.com/legal/terms.html
  x-logo:
    url: https://www.adobe.com/content/dam/cc/icons/adobe-campaign.svg
servers:
- url: https://{instance}.campaign.adobe.com
  description: Campaign Classic Instance
  variables:
    instance:
      description: Your Campaign Classic instance name
      default: YOUR_INSTANCE
tags:
- name: Delivery
  description: Prepare and submit message deliveries including email, SMS, and push notifications.
paths:
  /nl/jsp/soaprouter.jsp/nms-delivery/PrepareAndStart:
    post:
      operationId: deliveryPrepareAndStart
      summary: Adobe Campaign Prepare and Start a Delivery
      description: 'Prepares and immediately starts sending a delivery. Combines the preparation (target calculation, personalization) and sending steps. SOAP Action: nms:delivery#PrepareAndStart'
      tags:
      - Delivery
      parameters:
      - name: SOAPAction
        in: header
        required: true
        schema:
          type: string
          const: nms:delivery#PrepareAndStart
        example: example_value
      security:
      - SessionToken: []
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/DeliveryRequest'
      responses:
        '200':
          description: Delivery preparation and sending started.
        '500':
          $ref: '#/components/responses/SOAPFault'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /nl/jsp/soaprouter.jsp/nms-delivery/SubmitDelivery:
    post:
      operationId: submitDelivery
      summary: Adobe Campaign Submit a Delivery
      description: 'Submits a delivery for processing. The delivery must be in a valid state for submission. SOAP Action: nms:delivery#SubmitDelivery'
      tags:
      - Delivery
      parameters:
      - name: SOAPAction
        in: header
        required: true
        schema:
          type: string
          const: nms:delivery#SubmitDelivery
        example: example_value
      security:
      - SessionToken: []
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              $ref: '#/components/schemas/DeliveryRequest'
      responses:
        '200':
          description: Delivery submitted successfully.
        '500':
          $ref: '#/components/responses/SOAPFault'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    SOAPFault:
      type: object
      description: SOAP fault response indicating an error during operation processing.
      properties:
        faultcode:
          type: string
          description: Fault code identifying the error category.
          example: example_value
        faultstring:
          type: string
          description: Human-readable description of the error.
          example: example_value
        detail:
          type: string
          description: Additional error details.
          example: example_value
    DeliveryRequest:
      type: object
      description: SOAP envelope containing the delivery internal name or ID for preparation and sending operations.
      properties:
        deliveryId:
          type: integer
          description: Internal ID of the delivery.
          example: 42
        deliveryName:
          type: string
          description: Internal name of the delivery.
          example: Example Campaign
  responses:
    SOAPFault:
      description: SOAP fault indicating an error during operation processing.
      content:
        text/xml:
          schema:
            $ref: '#/components/schemas/SOAPFault'
  securitySchemes:
    SessionToken:
      type: apiKey
      in: header
      name: X-Security-Token
      description: Security token obtained from xtk:session#Logon. Must be passed alongside the session token cookie (__sessiontoken) on all authenticated requests. Tokens have a 24-hour lifecycle.
externalDocs:
  description: Campaign Classic SOAP Web Services Documentation
  url: https://experienceleague.adobe.com/docs/campaign-classic/using/configuring-campaign-classic/api/web-service-calls.html
