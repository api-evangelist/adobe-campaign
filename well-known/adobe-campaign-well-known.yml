source: live HTTPS probes of every apis.yml base host, every OpenAPI servers[] host and the docs/console hosts, 2026-08-13
notes: >-
  Adobe Campaign's own API bases are templated per customer instance
  (https://mc.adobe.io/{ORGANIZATION}/campaign and
  https://{instance}.campaign.adobe.com), so there is no anonymous origin to
  probe for those two. The probes below therefore cover the hosts Adobe actually
  operates and that a client touches: the corporate root (adobe.com), the
  developer portal (developer.adobe.com), the documentation host
  (experienceleague.adobe.com), the mc.adobe.io API gateway, and Adobe IMS
  (ims-na1.adobelogin.com), which is the OAuth authorization server every
  Campaign Standard / Campaign v8 API call authenticates against.
  developer.adobe.com is a single-page application that answers HTTP 200 with an
  HTML shell for EVERY /.well-known/* path — those rows are recorded as
  html-shell and treated as misses, not documents.
hosts_probed:
  - adobe.com
  - www.adobe.com
  - developer.adobe.com
  - experienceleague.adobe.com
  - mc.adobe.io
  - ims-na1.adobelogin.com
