cross_cutting_rules:
  - >-
    Both REST headers are mandatory: Authorization: Bearer AND X-Api-Key. Either
    alone is rejected.
  - >-
    <ORGANIZATION> selects the tenant AND selects stage vs production
    (<ORGANIZATION-mkt-stage>). There is no test-key prefix.
  - >-
    No idempotency key exists on any surface. Never blindly retry a POST that
    sends a message or creates a record.
  - >-
    Never construct a resource URL and never persist a PKey — follow the href the
    API returns.
  - >-
    Discover the schema with getResourceMetadata before writing; the Campaign data
    model is extended per tenant.
  - >-
    429 means the API-layer TPS ceiling was hit. No Retry-After header is
    documented; back off exponentially with jitter.
  - >-
    Campaign API credentials run in the administrator context and are excluded
    from the role context by default. Assume broad privilege.
