entries:
  - version: 8.9.3
    date: '2026-08-11'
    build: '9835'
    breaking: false
    highlights:
      - >-
        Adobe Analytics connector upgraded from the end-of-life Analytics 1.4
        API to the Analytics 2.0 API. Adobe performs the migration for hosted
        customers, but it re-imports the built-in webAnalyticsSendMetrics and
        webAnalyticsGetWebEvents technical workflows and overwrites the built-in
        Analytics JavaScript — any customization of those is lost.
      - Product improvements and security fixes.
    integration_impact: >-
      This is the closest thing in the recent window to a breaking change for
      integrators: customizations layered onto the two built-in Analytics
      workflows are overwritten on upgrade.
  - version: 8.9.2
    date: '2026-05-03'
    breaking: false
    mandatory_client_upgrade: true
    highlights:
      - All instances upgraded to Debian 13 and PostgreSQL 17.
      - Fixed transactional-event dates being set incorrectly by a data-type conversion (NEO-93923).
      - Fixed silent push notifications failing at delivery preparation when title/body were empty (NEO-93739).
      - Fixed Interaction SOAP calls for offer redemption failing on namespace resolution (NEO-94787).
      - FDA monitoring now disabled by default to prevent connection-log insertion errors (NEO-94841).
      - Fixed excessive memory consumption in the email pipeline (NEO-95088).
  - version: 8.9.1
    date: '2026-01-27'
    breaking: false
    highlights:
      - Product improvements and fixes; see the release notes page for the per-build list.
