scheme: product-build
scheme_note: >-
  Adobe Campaign versions the PRODUCT (Campaign v8 client console + server
  build), not the API. There is no API version segment in the REST path — the
  base is https://mc.adobe.io/{ORGANIZATION}/campaign with no /v1 — and no
  Accept-Version or dated-version header is documented. An API consumer
  therefore has no version handle of its own: the surface changes when the
  instance is upgraded. Release notes are dated and per-build, and each fix
  carries a NEO-#### issue id, which is unusually good traceability for an
  enterprise product; the gap is that they are written for administrators
  rather than API consumers, so REST/SOAP contract changes are not called out
  as such.
