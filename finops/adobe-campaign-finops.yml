meters:
  - name: active_profiles
    description: Marketable profiles tracked against the contracted profile commit
    unit: profile-month
    aggregation: max
    dimensions:
      - segment
      - region
  - name: messages_sent
    description: Outbound messages across all channels (email, SMS, push, direct mail)
    unit: message
    aggregation: sum
    dimensions:
      - channel
      - campaign
  - name: workflow_executions
    description: Campaign workflow runs (used for capacity planning, not billed separately)
    unit: execution
    aggregation: sum
principles:
  - name: Visibility
    description: >-
      Use the Adobe Campaign Reporting workspace and the message-volume
      dashboard to track consumption against the contracted commit.
  - name: Allocation
    description: >-
      Tag campaigns and workflows with brand / business-unit metadata so
      message volume rolls up to the consuming team.
  - name: Optimization
    description: >-
      Suppress dormant profiles to reduce profile commit; consolidate
      send-time-optimization windows; deduplicate cross-channel pressure
      and reduce send frequency to lower volume against commit.
  - name: Accountability
    description: >-
      Marketing Ops owns the active-profile and message-volume commit;
      Adobe TAM runs quarterly business reviews against the contract.
