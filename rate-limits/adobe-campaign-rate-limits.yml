specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Adobe Campaign
providerId: adobe-campaign
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Marketing
  - Campaign Management
notes: >-
  Adobe Campaign Standard documents request throttling on its REST API but
  exact per-second / per-minute numbers are not published in the public
  developer docs and vary by hosted-instance configuration. Bulk operations
  use staging endpoints to avoid synchronous throttling.
description: >-
  Adobe Campaign Standard REST API enforces per-tenant throttling. v8/Classic
  SOAP/REST endpoints are gated by the customer's hosted-instance capacity
  (typically tied to message-volume contract). Sustained excess returns 429
  or 503; bulk and transactional traffic should use staging or transactional
  endpoints rather than the synchronous REST surface.
sources:
  - https://developer.adobe.com/campaign-standard-apis/
  - https://experienceleague.adobe.com/docs/campaign-standard/using/integrating-with-adobe-experience-cloud/standard-apis.html
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: Campaign Standard REST API
    scope: tenant
    metric: requests_per_minute
    limit: see https://developer.adobe.com/campaign-standard-apis/
    notes: >-
      Per-tenant throttle on the Campaign Standard REST endpoints; bulk
      operations should use the staging or batch endpoints.
  - name: v8 / Classic SOAP / REST
    scope: instance
    metric: varies
    limit: see hosted-instance capacity (contracted message volume)
    notes: >-
      Throughput is bounded by the customer's hosted-instance capacity rather
      than a public per-second quota.
policies:
  - name: Backoff Strategy
    description: Exponential backoff with jitter; honor Retry-After when present.
  - name: Bulk vs synchronous
    description: >-
      Bulk staging endpoints decouple ingestion from synchronous API
      throttling and are the recommended path for high-volume jobs.
  - name: Tenant scope
    description: >-
      Limits apply across all credentials issued under a single tenant /
      hosted instance.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
