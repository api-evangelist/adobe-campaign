naftiko: 1.0.0-alpha2
info:
  label: Adobe Campaign Classic API — Delivery
  description: 'Adobe Campaign Classic API — Delivery. 2 operations. Lead operation: Adobe Campaign Prepare and Start a Delivery.
    Self-contained Naftiko capability covering one Adobe Campaign business surface.'
  tags:
  - Adobe Campaign
  - Delivery
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CAMPAIGN_API_KEY: ADOBE_CAMPAIGN_API_KEY
capability:
  consumes:
  - type: http
    namespace: classic-delivery
    baseUri: https://{instance}.campaign.adobe.com
    description: Adobe Campaign Classic API — Delivery business capability. Self-contained, no shared references.
    resources:
    - name: nl-jsp-soaprouter.jsp-nms-delivery-PrepareAndStart
      path: /nl/jsp/soaprouter.jsp/nms-delivery/PrepareAndStart
      operations:
      - name: deliveryprepareandstart
        method: POST
        description: Adobe Campaign Prepare and Start a Delivery
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SOAPAction
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: nl-jsp-soaprouter.jsp-nms-delivery-SubmitDelivery
      path: /nl/jsp/soaprouter.jsp/nms-delivery/SubmitDelivery
      operations:
      - name: submitdelivery
        method: POST
        description: Adobe Campaign Submit a Delivery
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: SOAPAction
          in: header
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-Security-Token
      value: '{{env.ADOBE_CAMPAIGN_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: classic-delivery-rest
    port: 8080
    description: REST adapter for Adobe Campaign Classic API — Delivery. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/nl/jsp/soaprouter-jsp/nms-delivery/prepareandstart
      name: nl-jsp-soaprouter-jsp-nms-delivery-prepareandstart
      description: REST surface for nl-jsp-soaprouter.jsp-nms-delivery-PrepareAndStart.
      operations:
      - method: POST
        name: deliveryprepareandstart
        description: Adobe Campaign Prepare and Start a Delivery
        call: classic-delivery.deliveryprepareandstart
        with:
          SOAPAction: rest.SOAPAction
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/nl/jsp/soaprouter-jsp/nms-delivery/submitdelivery
      name: nl-jsp-soaprouter-jsp-nms-delivery-submitdelivery
      description: REST surface for nl-jsp-soaprouter.jsp-nms-delivery-SubmitDelivery.
      operations:
      - method: POST
        name: submitdelivery
        description: Adobe Campaign Submit a Delivery
        call: classic-delivery.submitdelivery
        with:
          SOAPAction: rest.SOAPAction
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: classic-delivery-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Campaign Classic API — Delivery. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: adobe-campaign-prepare-and-start
      description: Adobe Campaign Prepare and Start a Delivery
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: classic-delivery.deliveryprepareandstart
      with:
        SOAPAction: tools.SOAPAction
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: adobe-campaign-submit-delivery
      description: Adobe Campaign Submit a Delivery
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: classic-delivery.submitdelivery
      with:
        SOAPAction: tools.SOAPAction
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
