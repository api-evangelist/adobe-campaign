naftiko: 1.0.0-alpha2
info:
  label: Adobe Campaign Standard API — Metadata
  description: 'Adobe Campaign Standard API — Metadata. 1 operations. Lead operation: Adobe Campaign Get Resource Metadata.
    Self-contained Naftiko capability covering one Adobe Campaign business surface.'
  tags:
  - Adobe Campaign
  - Metadata
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ADOBE_CAMPAIGN_API_KEY: ADOBE_CAMPAIGN_API_KEY
capability:
  consumes:
  - type: http
    namespace: standard-metadata
    baseUri: https://mc.adobe.io/{ORGANIZATION}/campaign
    description: Adobe Campaign Standard API — Metadata business capability. Self-contained, no shared references.
    resources:
    - name: profileAndServices-resourceType-resourceName
      path: /profileAndServices/resourceType/{resourceName}
      operations:
      - name: getresourcemetadata
        method: GET
        description: Adobe Campaign Get Resource Metadata
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: resourceName
          in: path
          type: string
          description: The name of the resource to describe.
          required: true
    authentication:
      type: bearer
      token: '{{env.ADOBE_CAMPAIGN_API_KEY}}'
  exposes:
  - type: rest
    namespace: standard-metadata-rest
    port: 8080
    description: REST adapter for Adobe Campaign Standard API — Metadata. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/profileandservices/resourcetype/{resourcename}
      name: profileandservices-resourcetype-resourcename
      description: REST surface for profileAndServices-resourceType-resourceName.
      operations:
      - method: GET
        name: getresourcemetadata
        description: Adobe Campaign Get Resource Metadata
        call: standard-metadata.getresourcemetadata
        with:
          resourceName: rest.resourceName
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: standard-metadata-mcp
    port: 9090
    transport: http
    description: MCP adapter for Adobe Campaign Standard API — Metadata. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: adobe-campaign-get-resource-metadata
      description: Adobe Campaign Get Resource Metadata
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: standard-metadata.getresourcemetadata
      with:
        resourceName: tools.resourceName
      outputParameters:
      - type: object
        mapping: $.
