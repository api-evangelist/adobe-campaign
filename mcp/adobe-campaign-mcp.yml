deployment:
  mode: none
  auth: unknown
  verified: searched
finding: >-
  Adobe ships Model Context Protocol servers today, but NOT for Adobe Campaign.
  Adobe's own llms.txt on the Campaign documentation host enumerates the current
  Adobe-hosted MCP servers and every one of them is an Adobe Experience Manager
  server under https://mcp.adobeaemcloud.com/adobe/mcp/ (/content,
  /content-readonly, /cloudmanager, /experience-governance). That same document
  states that a dedicated Experience League content MCP server "is not yet
  generally available". No Campaign-scoped MCP endpoint, no Campaign MCP npm or
  PyPI package, and no Campaign entry in the MCP registry was found. The AEM
  servers are deliberately NOT recorded as an Adobe Campaign agent surface —
  same company, different product, and crediting them here would assert a
  Campaign capability that does not exist.
adobe_mcp_servers_elsewhere:
  - product: Adobe Experience Manager as a Cloud Service
    endpoints:
      - https://mcp.adobeaemcloud.com/adobe/mcp/content
      - https://mcp.adobeaemcloud.com/adobe/mcp/content-readonly
      - https://mcp.adobeaemcloud.com/adobe/mcp/cloudmanager
      - https://mcp.adobeaemcloud.com/adobe/mcp/experience-governance
    documentation: https://experienceleague.adobe.com/en/docs/experience-manager-learn/cloud-service/ai/mcp-servers/overview
    covers_campaign: false
server:
  name: adobe-campaign
  transport: null
  url: null
auth:
  scheme: oauth2
  flow: client_credentials
  token_endpoint: https://ims-na1.adobelogin.com/ims/token/v3
