agentic_guardrails:
  note: >-
    Read agentic-access/adobe-campaign-agentic-access.yml before wiring any of
    these. submit_delivery, prepare_and_start_delivery, trigger_transactional_event,
    push_event, push_events and start_workflow all send real messages to real
    people and are irreversible once dispatched; Adobe's own llms.txt states that
    agent operations against Adobe products must run under the authenticated
    user's permissions and should escalate to a human where side effects are
    implied.
