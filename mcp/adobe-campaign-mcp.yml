source: >-
  openapi/*.yml in this repo; negative search of
  https://experienceleague.adobe.com/llms.txt (section "MCP Server Access",
  fetched 2026-08-13),
  https://experienceleague.adobe.com/en/docs/campaign/campaign-v8/developer/apis/get-started-apis
